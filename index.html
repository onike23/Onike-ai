let htmlCode="", titleG="", fnameG="";

function build(){
 let p=document.getElementById('prompt').value.trim();
 if(!p){alert('Type game idea'); return;}
 titleG=document.getElementById('title').value.trim()||p.slice(0,30)||'Onike Game';
 fnameG=(document.getElementById('fname').value.trim()||'onike-game').replace(/[^a-z0-9\-]/gi,'-').toLowerCase();
 htmlCode=makeQualityHunting(titleG,p);
 document.getElementById('prev').srcdoc=htmlCode;
 document.getElementById('status').innerHTML=`✅ BUILT: ${titleG}<br>Ready for HTML, JAR and APK`;
}

function makeQualityHunting(title,prompt){
 return `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;font-family:Arial;touch-action:none}
#c{position:absolute;top:0;left:0;width:100%;height:100%}#top{position:absolute;top:0;left:0;width:100%;height:52px;background:linear-gradient(#111,#000);display:flex;justify-content:space-between;align-items:center;padding:0 12px;color:#fff;z-index:10;border-bottom:2px solid #333;font-weight:700;font-size:13px}
#scope{position:absolute;width:200px;height:200px;border:3px solid #fff;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);display:none;z-index:11;box-shadow:0 0 0 3000px rgba(0,0,0,0.65)}#scope::before{content:'';position:absolute;top:50%;left:0;width:100%;height:1px;background:rgba(255,255,255,0.7)}#scope::after{content:'';position:absolute;left:50%;top:0;width:1px;height:100%;background:rgba(255,255,255,0.7)}
#controls{position:absolute;bottom:0;left:0;width:100%;height:90px;background:linear-gradient(transparent,#000 70%);display:flex;justify-content:space-between;align-items:flex-end;padding:10px;z-index:12}
.btn{padding:14px 18px;border:none;border-radius:12px;font-weight:900}#hit{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:44px;font-weight:900;color:#ff0;display:none;z-index:15;pointer-events:none;text-shadow:0 0 10px #f00}
</style></head><body><canvas id=c></canvas><div id=scope></div><div id=top><span>🏹 <span id=score>0</span></span><span>${title}</span><span>🔫 <span id=ammo>8</span>/8 ESC <span id=esc>0</span>/5</span></div><div id=hit>HIT!</div><div id=controls><button class=btn style="background:#222;color:#fff" onclick="reload()">↻ RELOAD 4</button><button class=btn style="background:linear-gradient(#e50914,#8b0000);color:#fff;min-width:130px" onclick="shoot()">🔫 SHOOT 5</button><button class=btn style="background:#222;color:#fff" onclick="toggleScope()">🔍 SCOPE 6</button></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR=devicePixelRatio||1;
function R(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}R();addEventListener('resize',R);
let score=0,ammo=8,esc=0,scopeOn=false,cross={x:W/2,y:H/2},recoil=0,animals=[],parts=[],trees=[];
for(let i=0;i<12;i++)trees.push({x:Math.random()*W,y:H*0.55+Math.random()*H*0.35,s:0.6+Math.random()*0.9});
class Animal{constructor(){this.t=Math.random()<0.5?'deer':'lion';this.x=Math.random()<0.5?-120:W+120;this.y=H*0.58+Math.random()*H*0.28;this.vx=(this.x<0?1:-1)*(1.2+Math.random()*2.2);this.f=0;this.alive=true;this.ht=0;this.hp=this.t==='lion'?2:1;this.pts=this.t==='lion'?50:30;this.sz=54;}update(){if(!this.alive){this.ht++;if(this.ht>30)return false;}this.x+=this.vx;this.f+=0.2;if(this.x<-150||this.x>W+150){esc++;document.getElementById('esc').innerText=esc;if(esc>=5){alert('GAME OVER Score:'+score);score=0;esc=0;ammo=8;animals=[];document.getElementById('score').innerText=0;document.getElementById('esc').innerText=0;document.getElementById('ammo').innerText=8;}return false;}return true;}draw(){ctx.save();ctx.translate(this.x,this.y);ctx.scale(this.vx>0?1:-1,1);let w=Math.sin(this.f)*6;ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(0,18,26,8,0,0,6.28);ctx.fill();if(!this.alive){ctx.rotate(this.ht*0.15);ctx.globalAlpha=Math.max(0,1-this.ht/30);}if(this.t==='deer'){ctx.fillStyle='#C19A6B';ctx.fillRect(-22,-12,44,20);ctx.fillStyle='#8B5A2B';ctx.fillRect(14+w,-16,18,10);ctx.fillStyle='#000';ctx.fillRect(28,-14,3,3);ctx.fillStyle='#8B4513';ctx.fillRect(-18,8,5,14+Math.abs(w*0.5));ctx.fillRect(-6,8,5,14-Math.abs(w*0.5));ctx.fillRect(6,8,5,14+Math.abs(w*0.5));ctx.fillRect(18,8,5,14-Math.abs(w*0.5));}else{ctx.fillStyle='#D4A017';ctx.fillRect(-24,-14,48,24);ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(18,-8,18,0,6.28);ctx.fill();ctx.fillStyle='#D4A017';ctx.fillRect(12,-16,20,14);ctx.fillStyle='#B8860B';ctx.fillRect(-20,10,6,16+w*0.3);ctx.fillRect(-6,10,6,16-w*0.3);ctx.fillRect(8,10,6,16+w*0.3);ctx.fillRect(20,10,6,16-w*0.3);}ctx.restore();}}
class P{constructor(x,y,c){this.x=x;this.y=y;this.vx=(Math.random()-0.5)*8;this.vy=(Math.random()-0.5)*8-2;this.l=20;this.c=c;}update(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.3;this.l--;return this.l>0;}draw(){ctx.fillStyle=this.c;ctx.globalAlpha=this.l/20;ctx.beginPath();ctx.arc(this.x,this.y,3,0,6.28);ctx.fill();ctx.globalAlpha=1;}}
function spawn(){if(animals.length<6)animals.push(new Animal());}
function bg(){let g=ctx.createLinearGradient(0,0,0,H*0.6);g.addColorStop(0,'#87CEEB');g.addColorStop(1,'#E0F6FF');ctx.fillStyle=g;ctx.fillRect(0,0,W,H*0.6);ctx.fillStyle='#A0A0A0';ctx.beginPath();ctx.moveTo(0,H*0.55);ctx.lineTo(W*0.2,H*0.35);ctx.lineTo(W*0.6,H*0.32);ctx.lineTo(W,H*0.38);ctx.lineTo(W,H*0.6);ctx.lineTo(0,H*0.6);ctx.closePath();ctx.fill();ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(W*0.85,H*0.12,28,0,6.28);ctx.fill();let gg=ctx.createLinearGradient(0,H*0.55,0,H);gg.addColorStop(0,'#4CAF50');gg.addColorStop(1,'#3E2723');ctx.fillStyle=gg;ctx.fillRect(0,H*0.55,W,H*0.45);trees.forEach(t=>{ctx.globalAlpha=0.6+t.s*0.4;ctx.font=(28*t.s)+'px Arial';ctx.fillText('🌳',t.x,t.y);});ctx.globalAlpha=1;}
function loop(){bg();animals=animals.filter(a=>{let ok=a.update();if(ok)a.draw();return ok;});parts=parts.filter(p=>{let ok=p.update();if(ok)p.draw();return ok;});ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cross.x-18,cross.y);ctx.lineTo(cross.x-6,cross.y);ctx.moveTo(cross.x+6,cross.y);ctx.lineTo(cross.x+18,cross.y);ctx.moveTo(cross.x,cross.y-18);ctx.lineTo(cross.x,cross.y-6);ctx.moveTo(cross.x,cross.y+6);ctx.lineTo(cross.x,cross.y+18);ctx.stroke();ctx.fillStyle='#f00';ctx.beginPath();ctx.arc(cross.x,cross.y,3,0,6.28);ctx.fill();ctx.save();ctx.translate(W/2,H);ctx.translate(0,-recoil*12);ctx.font='64px Arial';ctx.textAlign='center';ctx.fillText('🔫',0,-12);ctx.restore();if(recoil>0)recoil*=0.85;requestAnimationFrame(loop);}
function shoot(){if(ammo<=0){show('RELOAD!');return;}ammo--;document.getElementById('ammo').innerText=ammo;recoil=1;let hit=null,md=999;animals.forEach(a=>{if(!a.alive)return;let d=Math.hypot(a.x-cross.x,a.y-cross.y);if(d<md&&d<a.sz){md=d;hit=a;}});if(hit){hit.hp--;if(hit.hp<=0){hit.alive=false;for(let i=0;i<12;i++)parts.push(new P(hit.x,hit.y-10,hit.t==='lion'?'#D4A017':'#8B0000'));score+=hit.pts;document.getElementById('score').innerText=score;show('HIT +'+hit.pts);canvas.style.transform='translate('+(Math.random()*6-3)+'px,'+(Math.random()*6-3)+'px)';setTimeout(()=>canvas.style.transform='',80);}else{for(let i=0;i<5;i++)parts.push(new P(hit.x,hit.y-10,'#ff0'));show('HIT!');hit.vx*=-1.2;}setTimeout(()=>{animals=animals.filter(a=>a!==hit);if(animals.length<5)spawn();},400);}else{for(let i=0;i<4;i++)parts.push(new P(cross.x+(Math.random()-0.5)*20,cross.y+(Math.random()-0.5)*20,'#aaa'));}}
function show(t){let h=document.getElementById('hit');h.innerText=t;h.style.display='block';setTimeout(()=>h.style.display='none',700);}
function reload(){ammo=8;document.getElementById('ammo').innerText=ammo;show('RELOADED');}
function toggleScope(){scopeOn=!scopeOn;let s=document.getElementById('scope');s.style.display=scopeOn?'block':'none';s.style.left=cross.x+'px';s.style.top=cross.y+'px';s.style.width='220px';s.style.height='220px';}
canvas.addEventListener('mousemove',e=>{cross.x=e.clientX;cross.y=e.clientY;if(scopeOn){let s=document.getElementById('scope');s.style.left=cross.x+'px';s.style.top=cross.y+'px';}});
canvas.addEventListener('touchmove',e=>{e.preventDefault();cross.x=e.touches[0].clientX;cross.y=e.touches[0].clientY;if(scopeOn){let s=document.getElementById('scope');s.style.left=cross.x+'px';s.style.top=cross.y+'px';}},{passive:false});
canvas.addEventListener('mousedown',shoot);canvas.addEventListener('touchstart',e=>{e.preventDefault();cross.x=e.touches[0].clientX;cross.y=e.touches[0].clientY;shoot();},{passive:false});
document.addEventListener('keydown',e=>{if(e.key=='5'||e.key==' ')shoot();if(e.key=='4')reload();if(e.key=='6')toggleScope();});
for(let i=0;i<4;i++)setTimeout(spawn,i*600);setInterval(()=>{if(animals.length<6&&Math.random()<0.7)spawn();},1200);loop();
<\/script></body></html>`;
}
