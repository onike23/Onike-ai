<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onike V5 - AI Auto Photo Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;padding:8px}
.box{background:#111;border:1px solid #222;padding:12px;border-radius:14px;margin-bottom:8px}
input,textarea{width:100%;background:#1e1e1e;border:1px solid #333;padding:12px;border-radius:10px;color:#fff;margin-top:6px;box-sizing:border-box}
button{border:none;padding:14px;border-radius:12px;color:#fff;font-weight:700;width:100%;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.grid div{background:#222;padding:10px;border-radius:10px;text-align:center;font-size:10px;border:1px solid #333}
.preview{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.preview div{background:#1a1a1a;padding:6px;border-radius:10px;text-align:center;border:1px solid #333}
.preview img{width:100%;height:80px;object-fit:cover;border-radius:8px}
iframe{width:100%;height:480px;background:#000;border:none;border-radius:12px;margin-top:8px}
</style>
</head>
<body>
<h2 style="text-align:center">🤖 Onike V5 - AUTO PHOTO + ENEMY GENERATOR</h2>
<div style="text-align:center;font-size:10px;color:#0f0">Type idea → AI generates photos + enemies + background by itself!</div>

<div class="box">
<textarea id="prompt" rows="3" placeholder="Example: Build fighting game - Ugandan warrior vs zombie boss, ninja vs samurai, boda rider vs police, boxer vs Mike Tyson"></textarea>
<input id="title" value="Auto Photo Fighting Game" placeholder="Title">
<input id="fname" value="auto-photo-fighting" placeholder="File name">

<div class="grid">
<div onclick="quick('fighting game Ugandan warrior vs zombie boss')"><b>🥊</b>Warrior vs Zombie</div>
<div onclick="quick('ninja vs samurai sword fight Japan')"><b>⚔️</b>Ninja vs Samurai</div>
<div onclick="quick('boda boda rider vs traffic police Kampala')"><b>🏍️</b>Boda vs Police</div>
<div onclick="quick('boxer vs Mike Tyson boxing ring')"><b>🥊</b>Boxing</div>
<div onclick="quick('zombie shooter with soldier vs zombies')"><b>🔫</b>Soldier vs Zombies</div>
<div onclick="quick('football Uganda Cranes vs Nigeria')"><b>⚽</b>Uganda vs Nigeria</div>
</div>

<button onclick="generatePhotos()" style="background:#FF9800">1️⃣ GENERATE PHOTOS + ENEMIES FROM IDEA (AI)</button>
<button onclick="buildAll()" style="background:linear-gradient(90deg,#ff0033,#7700ff)">2️⃣ BUILD GAME WITH THOSE PHOTOS</button>

<div class="preview" id="photoPreview">
<div><small>Player Auto</small><img id="p1Auto" src="https://via.placeholder.com/100x100/222/fff?text=AI+Player"><div id="p1Label" style="font-size:8px">Waiting</div></div>
<div><small>Enemy Auto</small><img id="p2Auto" src="https://via.placeholder.com/100x100/400/fff?text=AI+Enemy"><div id="p2Label" style="font-size:8px">Waiting</div></div>
<div><small>Background Auto</small><img id="bgAuto" src="https://via.placeholder.com/100x100/111/fff?text=BG"><div id="bgLabel" style="font-size:8px">Waiting</div></div>
</div>
</div>

<div class="box">
<iframe id="prev"></iframe>
<button onclick="dlHTML()" style="background:#2196F3">📥 Download HTML with AI Photos Inside</button>
<button onclick="dlJAVA()" style="background:#FF9800">📱 Download JAVA.jar with Photos for T528</button>
<button onclick="dlANDROID()" style="background:#00c853">🤖 Download ANDROID APK.zip</button>
<div id="status" style="text-align:center;font-size:11px;color:#0f0;margin-top:8px"></div>
</div>

<script>
let htmlCode="", titleG="", fnameG="", pkg="";
let autoP1="", autoP2="", autoBg="", generated=false;

function quick(t){document.getElementById('prompt').value=t; document.getElementById('title').value=t.slice(0,25).toUpperCase(); document.getElementById('fname').value=t.replace(/\s+/g,'-').slice(0,20).toLowerCase()+'-game'; generatePhotos();}

function generatePhotos(){
 let p=document.getElementById('prompt').value.toLowerCase();
 if(!p){alert('Type game idea first! e.g. fighting game warrior vs zombie'); return;}
 titleG=document.getElementById('title').value||'AI Photo Game';
 fnameG=document.getElementById('fname').value.replace(/[^a-z0-9\-]/gi,'-')||'ai-photo-game';

 // AI PARSE: Split by "vs" to get player vs enemy
 let parts=p.split('vs');
 let playerIdea = parts[0]?parts[0].replace(/build|a|game|fighting|racing|shooter/gi,'').trim():'Ugandan warrior fighter';
 let enemyIdea = parts[1]?parts[1].trim():'zombie boss monster';
 let bgIdea = 'fighting arena background';

 if(p.includes('boda')){ playerIdea='Ugandan boda boda rider Kampala'; enemyIdea='traffic police'; bgIdea='Kampala city road'; }
 else if(p.includes('ninja')){ playerIdea='ninja warrior black mask'; enemyIdea='samurai warrior Japan'; bgIdea='Japanese temple dojo'; }
 else if(p.includes('zombie')||p.includes('shooter')){ playerIdea='army soldier hero with gun'; enemyIdea='zombie monster horror'; bgIdea='abandoned city apocalypse'; }
 else if(p.includes('football')){ playerIdea='Uganda Cranes football player yellow jersey'; enemyIdea='Nigeria Super Eagles football player green jersey'; bgIdea='football stadium crowd'; }
 else if(p.includes('box')||p.includes('tyson')){ playerIdea='Ugandan boxer champion'; enemyIdea='Mike Tyson boxing'; bgIdea='boxing ring crowd'; }

 // Use Pollinations AI - FREE image generator that generates from text, no key needed!
 // It will generate real photos from your ideas
 let seed1=Math.floor(Math.random()*1000), seed2=seed1+1, seedBg=seed1+2;
 autoP1 = `https://image.pollinations.ai/prompt/${encodeURIComponent(playerIdea + ', portrait, game character, 4k, detailed face') }?width=300&height=400&seed=${seed1}&nologo=true`;
 autoP2 = `https://image.pollinations.ai/prompt/${encodeURIComponent(enemyIdea + ', portrait, game enemy villain, 4k, detailed face') }?width=300&height=400&seed=${seed2}&nologo=true`;
 autoBg = `https://image.pollinations.ai/prompt/${encodeURIComponent(bgIdea + ', game background, arena, 4k') }?width=640&height=360&seed=${seedBg}&nologo=true`;

 // Fallback if pollinations blocked in Uganda - use dicebear + unsplash style avatars
 let fallbackP1 = `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(playerIdea)}&backgroundColor=b6e3f4`;
 let fallbackP2 = `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(enemyIdea)}&backgroundColor=c0aede`;

 document.getElementById('p1Auto').src=autoP1;
 document.getElementById('p2Auto').src=autoP2;
 document.getElementById('bgAuto').src=autoBg;
 document.getElementById('p1Label').innerText=playerIdea.slice(0,20);
 document.getElementById('p2Label').innerText=enemyIdea.slice(0,20);
 document.getElementById('bgLabel').innerText=bgIdea.slice(0,20);

 // Try load, if fails use fallback
 document.getElementById('p1Auto').onerror=()=>{ document.getElementById('p1Auto').src=fallbackP1; autoP1=fallbackP1; }
 document.getElementById('p2Auto').onerror=()=>{ document.getElementById('p2Auto').src=fallbackP2; autoP2=fallbackP2; }

 generated=true;
 document.getElementById('status').innerHTML=`✅ AI Generated Photos!<br>Player: ${playerIdea}<br>Enemy: ${enemyIdea}<br>BG: ${bgIdea}<br>Now click BUILD GAME`;
 // Auto build after 2 sec
 setTimeout(buildAll, 2500);
}

function buildAll(){
 if(!generated){ generatePhotos(); return; }
 let p=document.getElementById('prompt').value||'fighting game';
 titleG=document.getElementById('title').value||'AI Photo Fighter';
 fnameG=document.getElementById('fname').value.replace(/[^a-z0-9\-]/gi,'-')||'ai-photo-game';
 pkg=titleG.replace(/[^A-Za-z0-9]/g,''); if(!/^[A-Za-z]/.test(pkg))pkg='Game'+pkg;

 let type='fighting';
 if(p.toLowerCase().includes('shoot')||p.toLowerCase().includes('zombie')) type='shooter';
 else if(p.toLowerCase().includes('racing')||p.toLowerCase().includes('boda')) type='racing';
 else type='fighting';

 htmlCode=makeGame(type,titleG,autoP1,autoP2,autoBg);
 document.getElementById('prev').srcdoc=htmlCode;
 document.getElementById('status').innerHTML=`✅ BUILT: ${type.toUpperCase()} with AI Photos!<br>${titleG}<br>Photos are LIVE from AI - download to keep them offline`;
}

function makeGame(type,title,p1,p2,bg){
 let bgCss = bg? `background-image:url('${bg}');background-size:cover;background-position:center;` : `background:linear-gradient(#333,#000);`;

 if(type==='fighting') return `<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width"><style>
body{margin:0;background:#111;color:#fff;text-align:center;font-family:Arial;overflow:hidden}
#game{position:relative;width:100%;max-width:360px;height:400px;margin:auto;border:2px solid #f00;${bgCss} overflow:hidden}
.fighter{position:absolute;bottom:30px;width:90px;height:140px;transition:all 0.15s}
.fighter img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:3px solid #fff;box-shadow:0 0 15px #000}
#player{left:20px} #enemy{right:20px}
#punchEff{position:absolute;width:35px;height:20px;background:#ff0;border-radius:50%;display:none;box-shadow:0 0 15px #ff0;z-index:10}
#bar{display:flex;justify-content:space-between;padding:6px 10px;background:#000}.hp{width:40%;height:18px;background:#333;border-radius:9px;overflow:hidden}.hp div{height:100%;background:linear-gradient(90deg,#0f0,#ff0);width:100%}
button{padding:13px 12px;margin:3px;border:none;border-radius:10px;background:#222;color:#fff;font-weight:700;min-width:55px} button.p{background:#e50914} button.k{background:#FF9800}
</style></head><body>
<div id=bar><div class=hp><div id=h1></div></div><div style="font-size:9px">${title}</div><div class=hp><div id=h2></div></div></div>
<div id=game><div id=player class=fighter><img src="${p1}"></div><div id=enemy class=fighter><img src="${p2}"></div><div id=punchEff></div></div>
<div style="font-size:11px">YOU: <span id=hp1>100</span> | ENEMY: <span id=hp2>100</span> | Score <span id=sc>0</span></div>
<div><button onclick="move(-1)">4←</button><button onclick="move(1)">6→</button><button class=p onclick="punch()">5 PUNCH</button><button class=k onclick="kick()">8 KICK</button></div>
<script>
let pH=100,eH=100,px=20,ex=250,sc=0;
let player=document.getElementById('player'), enemy=document.getElementById('enemy'), eff=document.getElementById('punchEff');
function upd(){ document.getElementById('h1').style.width=pH+'%'; document.getElementById('h2').style.width=eH+'%'; document.getElementById('hp1').innerText=pH; document.getElementById('hp2').innerText=eH; document.getElementById('sc').innerText=sc; }
function move(d){ px=Math.max(5,Math.min(140,px+d*25)); player.style.left=px+'px'; }
function punch(){ eff.style.display='block'; eff.style.left=(px+75)+'px'; eff.style.top='130px'; eff.style.background='#ff0'; setTimeout(()=>eff.style.display='none',150);
 if(Math.abs(px-ex)<110){ eH-=20; sc+=10; enemy.style.filter='brightness(2) contrast(1.5)'; enemy.style.transform='translateX(12px) rotate(3deg)'; setTimeout(()=>{enemy.style.filter=''; enemy.style.transform='';},150);
  if(eH<=0){ eH=100; sc+=50; alert('Enemy KO! You WIN Score:'+sc); } upd(); } }
function kick(){ eff.style.display='block'; eff.style.left=(px+80)+'px'; eff.style.top='170px'; eff.style.background='#ff9800'; eff.style.width='40px'; setTimeout(()=>{eff.style.display='none'; eff.style.width='35px';},200);
 if(Math.abs(px-ex)<120){ eH-=28; sc+=15; enemy.style.transform='translateX(15px) rotate(8deg) scale(0.95)'; setTimeout(()=>enemy.style.transform='',180);
  if(eH<=0){ eH=100; sc+=50; alert('KICK KO! WIN Score:'+sc); } upd(); } }
function ai(){ if(Math.abs(px-ex)>100){ ex+=(px>ex? -1:1)*0.7; enemy.style.left=ex+'px'; } else if(Math.random()<0.05){ eff.style.display='block'; eff.style.left=(ex-25)+'px'; eff.style.top='140px'; eff.style.background='#f00'; setTimeout(()=>eff.style.display='none',150); pH-=14; player.style.filter='brightness(2)'; setTimeout(()=>player.style.filter='',150); if(pH<=0){ alert('You LOSE! Score:'+sc); pH=100; eH=100; sc=0; } upd(); } requestAnimationFrame(ai); } ai(); upd();
document.addEventListener('keydown',e=>{ if(e.key=='4')move(-1); if(e.key=='6')move(1); if(e.key=='5')punch(); if(e.key=='8')kick(); });
<\/script></body></html>`;

 // shooter with auto photos
 return `<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width"><style>body{margin:0;background:#000;color:#fff;text-align:center}#game{position:relative;width:320px;height:430px;margin:auto;border:2px solid #f00;${bgCss} overflow:hidden}.enemy{position:absolute;width:60px;height:60px;cursor:pointer}.enemy img{width:100%;height:100%;border-radius:50%;border:2px solid #f00;object-fit:cover}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:32px;color:#fff;pointer-events:none}button{padding:15px 40px;margin:5px;background:#e50914;color:#fff;border:none;border-radius:20px;font-size:16px;font-weight:700}</style></head><body><h3>${title}</h3><div id=game><div id=cross>+</div></div><div>Score <span id=sc>0</span> | Enemies <span id=en>5</span></div><button onclick="shootAll()">🔫 SHOOT ALL 5</button><script>
let game=document.getElementById('game'),sc=0,enemies=[];
function spawn(){ let d=document.createElement('div'); d.className='enemy'; d.innerHTML='<img src="${p2}">'; d.style.left=Math.random()*250+'px'; d.style.top=Math.random()*300+'px'; game.appendChild(d); enemies.push(d); d.onclick=()=>{ game.removeChild(d); enemies=enemies.filter(e=>e!=d); sc++; document.getElementById('sc').innerText=sc; document.getElementById('en').innerText=enemies.length; if(enemies.length<5) spawn(); }; setTimeout(()=>{ if(d.parentNode){ d.style.left=Math.random()*250+'px'; d.style.top=Math.random()*300+'px'; } },1500); }
for(let i=0;i<5;i++) spawn();
function shootAll(){ enemies.slice(0,2).forEach(e=>{ if(e.parentNode)game.removeChild(e); sc++; }); enemies=enemies.slice(2); document.getElementById('sc').innerText=sc; document.getElementById('en').innerText=enemies.length; while(enemies.length<5) spawn(); }
setInterval(()=>{ if(Math.random()<0.3&&enemies.length<8) spawn(); },1000);
<\/script></body></html>`;
}

async function dlHTML(){ if(!htmlCode)return alert('Generate first'); let b=new Blob([htmlCode],{type:'text/html'}); let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fnameG+'.html';a.click(); }
async function dlJAVA(){
 if(!htmlCode)return alert('Build first');
 let zip=new JSZip(); zip.file("META-INF/MANIFEST.MF",`Manifest-Version: 1.0\nMIDlet-Name: ${titleG}\nMIDlet-Version: 1.0\nMIDlet-Vendor: Onike\nMIDlet-1: ${titleG},, Game\nMicroEdition-Configuration: CLDC-1.1\nMicroEdition-Profile: MIDP-2.0\n`);
 zip.file("game.html",htmlCode);
 let blob=await zip.generateAsync({type:"blob"}); let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fnameG+'.jar';a.click();
 let jad=`MIDlet-Name: ${titleG}\nMIDlet-Version: 1.0\nMIDlet-Vendor: Onike\nMIDlet-1: ${titleG},, Game\nMIDlet-Jar-URL: ${fnameG}.jar\nMIDlet-Jar-Size: ${blob.size}\nMicroEdition-Configuration: CLDC-1.1\nMicroEdition-Profile: MIDP-2.0\n`; let b2=new Blob([jad],{type:"text/vnd.sun.j2me.app-descriptor"}); let b=document.createElement('a');b.href=URL.createObjectURL(b2);b.download=fnameG+'.jad';b.click();
}
async function dlANDROID(){
 if(!htmlCode)return alert('Build first');
 let zip=new JSZip(); zip.file("app/src/main/assets/game.html",htmlCode);
 zip.file("README.txt","AI photos are live links from Pollinations AI.\nFor offline APK with photos inside, download HTML and convert base64.\nFast: appsgeyser.com -> paste https://onike23.github.io/Onike-ai/"+fnameG+".html");
 let blob=await zip.generateAsync({type:"blob"}); let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fnameG+"-ANDROID-AI-PHOTO.zip";a.click();
}
</script>
</body>
  </html>
