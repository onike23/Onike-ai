<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onike Quality Engine</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{margin:0;background:#050505;color:#fff;font-family:Arial;padding:10px}
.box{background:#0f0f0f;border:1px solid #222;padding:14px;border-radius:16px;margin-bottom:10px}
input,textarea{width:100%;background:#1a1a1a;border:1px solid #333;padding:14px;border-radius:12px;color:#fff;margin-top:8px;box-sizing:border-box;font-size:14px}
textarea{height:100px}
button{border:none;padding:16px;border-radius:12px;color:#fff;font-weight:800;width:100%;margin-top:8px;font-size:14px}
iframe{width:100%;height:620px;background:#000;border:2px solid #333;border-radius:12px;margin-top:10px}
h2{text-align:center;margin:6px 0}
</style>
</head>
<body>
<h2>🔥 Onike Quality Engine - Like Pro AI</h2>
<div style="text-align:center;font-size:11px;color:#666;margin-bottom:10px">Real canvas engine • Particles • Sprites • AI • Same quality as Buildbox / GDevelop</div>

<div class="box">
<textarea id="prompt" placeholder="Type your game idea in detail... e.g. Realistic animal hunting in African savanna, I am a hunter with sniper rifle hunting lions and deer that run and hide behind trees, with scope zoom and blood effects"></textarea>
<input id="title" placeholder="Game Title">
<input id="fname" placeholder="File name">
<button onclick="build()" style="background:linear-gradient(90deg,#ff0033,#ff6a00)">⚡ BUILD QUALITY GAME LIKE PRO ENGINE</button>
<div id="status" style="text-align:center;font-size:11px;color:#0f0;margin-top:8px;min-height:16px"></div>
</div>

<div class="box">
<iframe id="prev"></iframe>
<button onclick="dl()" style="background:#2196F3">📥 DOWNLOAD QUALITY GAME (Works offline)</button>
<button onclick="dlJar()" style="background:#FF9800;margin-top:6px">📱 DOWNLOAD FOR JAVA PHONE T528 (.jar)</button>
</div>

<script>
let htmlCode="", titleG="", fnameG="";

function build(){
 let p=document.getElementById('prompt').value.trim();
 if(!p){ alert('Type your game idea - detailed'); return; }
 titleG=document.getElementById('title').value.trim()||p.slice(0,32)||'Quality Game';
 fnameG=(document.getElementById('fname').value.trim()||'quality-game').replace(/[^a-z0-9\-]/gi,'-').toLowerCase();

 let type='hunting';
 let low=p.toLowerCase();
 if(low.includes('football')||low.includes('soccer')) type='football';
 else if(low.includes('fight')||low.includes('boxing')||low.includes('karate')) type='fighting';
 else if(low.includes('racing')||low.includes('car')||low.includes('boda')) type='racing';
 else if(low.includes('zombie')||low.includes('shooter')) type='shooter';
 else type='hunting';

 if(type==='hunting') htmlCode=makeQualityHunting(titleG,p);
 else if(type==='football') htmlCode=makeQualityFootball(titleG);
 else if(type==='fighting') htmlCode=makeQualityFighting(titleG);
 else if(type==='racing') htmlCode=makeQualityRacing(titleG);
 else htmlCode=makeQualityShooter(titleG);

 document.getElementById('prev').srcdoc=htmlCode;
 document.getElementById('status').innerHTML=`✅ QUALITY ${type.toUpperCase()} ENGINE BUILT<br>60 FPS • Particles • AI • Sprites • Like pro engine`;
}

function makeQualityHunting(title,prompt){
 // Parse animals from prompt
 let hasLion=prompt.toLowerCase().includes('lion'), hasDeer=prompt.toLowerCase().includes('deer')||!hasLion;

 return `<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#000;overflow:hidden;font-family:Arial;touch-action:none}
#c{position:absolute;top:0;left:0;width:100%;height:100%;cursor:crosshair}
#ui{position:absolute;top:0;left:0;width:100%;pointer-events:none;z-index:10}
#top{height:52px;background:linear-gradient(#111,#000);display:flex;justify-content:space-between;align-items:center;padding:0 12px;border-bottom:2px solid #333;font-size:13px;font-weight:700}
#scope{position:absolute;width:180px;height:180px;border:3px solid #fff;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);display:none;z-index:11;box-shadow:0 0 0 2000px rgba(0,0,0,0.6), 0 0 20px #000 inset}
#scope::before{content:'';position:absolute;top:50%;left:0;width:100%;height:1px;background:rgba(255,255,255,0.6)} #scope::after{content:'';position:absolute;left:50%;top:0;width:1px;height:100%;background:rgba(255,255,255,0.6)}
#scope.dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:6px;background:#f00;border-radius:50%}
#controls{position:absolute;bottom:0;left:0;width:100%;height:90px;background:linear-gradient(transparent,#000 40%);display:flex;align-items:flex-end;justify-content:space-between;padding:10px;pointer-events:auto;z-index:12}
.btn{padding:14px 18px;border:none;border-radius:12px;font-weight:900;font-size:13px;pointer-events:auto}
.btn-shoot{background:linear-gradient(#e50914,#8b0000);color:#fff;min-width:120px;box-shadow:0 4px 12px rgba(229,9,20,0.5)}
.btn-reload{background:#222;color:#fff;border:1px solid #444}
#hitmark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:900;color:#ff0;text-shadow:0 0 10px #f00;display:none;z-index:15;pointer-events:none}
</style></head><body>
<canvas id=c></canvas>
<div id=scope><div class=dot></div></div>
<div id=ui><div id=top><span>🏹 <span id=score>0</span> SCORE</span><span style="font-size:11px">${title}</span><span>🔫 <span id=ammo>8</span>/8 • ESC <span id=esc>0</span>/5</span></div><div id=hitmark>HIT! +30</div></div>
<div id=controls><button class=btn btn-reload onclick="reload()">↻ RELOAD 4</button><button class=btn btn-shoot onclick="shoot()">🔫 SHOOT 5</button><button class=btn btn-reload onclick="toggleScope()">🔍 SCOPE 6</button></div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let W,H, DPR=window.devicePixelRatio||1;
function resize(){ W=window.innerWidth; H=window.innerHeight; canvas.width=W*DPR; canvas.height=H*DPR; canvas.style.width=W+'px'; canvas.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
resize(); window.addEventListener('resize',resize);

let score=0, ammo=8, escaped=0, scopeOn=false, cross={x:W/2,y:H/2}, gunRecoil=0;
let animals=[], particles=[], trees=[];
let mouse={x:W/2,y:H/2};

// Generate forest trees for depth
for(let i=0;i<14;i++){ trees.push({x:Math.random()*W, y:H*0.55+Math.random()*H*0.35, s:0.6+Math.random()*0.9, type:Math.random()<0.5?'🌳':'🌲'}); }
trees.sort((a,b)=>a.s-b.s);

class Animal{
 constructor(){
  this.type=Math.random()<0.55?'deer':'lion';
  if('${hasLion}'==='false'&&'${hasDeer}'==='true') this.type='deer';
  if('${hasDeer}'==='false') this.type='lion';
  this.x=Math.random()<0.5?-120:W+120;
  this.y=H*0.58+Math.random()*H*0.28;
  this.vx=(this.x<0?1:-1)*(1.2+Math.random()*2.2);
  this.vy=(Math.random()-0.5)*0.4;
  this.frame=0; this.frameMax=this.type==='deer'?4:6;
  this.alive=true; this.hitTime=0;
  this.size=this.type==='lion'?58:52;
  this.speed=Math.abs(this.vx);
  this.dir=this.vx>0?1:-1;
  this.hp=this.type==='lion'?2:1;
  this.points=this.type==='lion'?50:30;
 }
 update(){
  if(!this.alive){ this.hitTime++; if(this.hitTime>30) return false; }
  this.x+=this.vx; this.y+=this.vy;
  this.frame+=0.18+this.speed*0.05;
  if(this.frame>=this.frameMax) this.frame=0;
  // bounce Y
  if(this.y<H*0.55||this.y>H*0.92) this.vy*=-1;
  // escape check
  if(this.x<-150||this.x>W+150){ escaped++; document.getElementById('esc').innerText=escaped; if(escaped>=5){ alert('GAME OVER! 5 animals escaped!\\nFinal Score: '+score); resetGame(); } return false; }
  return true;
 }
 draw(){
  ctx.save(); ctx.translate(this.x,this.y); ctx.scale(this.dir,1);
  let walk=Math.sin(this.frame)*6;
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(0,18, this.size*0.5, 8, 0,0,Math.PI*2); ctx.fill();
  if(!this.alive){
   ctx.rotate(this.hitTime*0.15); ctx.globalAlpha=Math.max(0,1-this.hitTime/30);
  }
  // body - quality sprite with shapes not emoji
  if(this.type==='deer'){
   // deer body
   ctx.fillStyle='#C19A6B'; ctx.fillRect(-22,-12,44,20);
   ctx.fillStyle='#8B5A2B'; ctx.fillRect(14+walk,-16,18,10); // head
   ctx.fillStyle='#000'; ctx.fillRect(28,-14,3,3); // eye
   ctx.fillStyle='#DEB887'; ctx.fillRect(-22,-8,10,18); // tail
   // legs with walk animation
   ctx.fillStyle='#8B4513';
   ctx.fillRect(-18,8,5,14+Math.abs(walk*0.5)); ctx.fillRect(-6,8,5,14-Math.abs(walk*0.5));
   ctx.fillRect(6,8,5,14+Math.abs(walk*0.5)); ctx.fillRect(18,8,5,14-Math.abs(walk*0.5));
   // antlers
   ctx.strokeStyle='#5D4037'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(28,-16); ctx.lineTo(32,-26); ctx.lineTo(28,-22); ctx.moveTo(32,-26); ctx.lineTo(36,-28); ctx.stroke();
  } else {
   // lion - quality
   ctx.fillStyle='#D4A017'; ctx.fillRect(-24,-14,48,24);
   ctx.fillStyle='#FFD700'; ctx.beginPath(); ctx.arc(18,-8,18,0,Math.PI*2); ctx.fill(); // mane
   ctx.fillStyle='#D4A017'; ctx.fillRect(12,-16,20,14); // head
   ctx.fillStyle='#000'; ctx.fillRect(26,-12,4,4); // eye
   ctx.fillStyle='#8B4513'; ctx.fillRect(30,-8,8,6); // nose
   // legs
   ctx.fillStyle='#B8860B';
   ctx.fillRect(-20,10,6,16+walk*0.3); ctx.fillRect(-6,10,6,16-walk*0.3);
   ctx.fillRect(8,10,6,16+walk*0.3); ctx.fillRect(20,10,6,16-walk*0.3);
   // tail
   ctx.strokeStyle='#8B4513'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(-24,0); ctx.lineTo(-34,8+walk); ctx.stroke();
  }
  ctx.restore();
 }
}

class Particle{
 constructor(x,y,color){
  this.x=x; this.y=y; this.vx=(Math.random()-0.5)*8; this.vy=(Math.random()-0.5)*8-2;
  this.life=20; this.color=color;
 }
 update(){ this.x+=this.vx; this.y+=this.vy; this.vy+=0.3; this.life--; return this.life>0; }
 draw(){ ctx.fillStyle=this.color; ctx.globalAlpha=this.life/20; ctx.beginPath(); ctx.arc(this.x,this.y,3,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
}

function spawnAnimal(){ if(animals.length<6) animals.push(new Animal()); }

function drawBackground(){
 // sky gradient
 let g=ctx.createLinearGradient(0,0,0,H*0.6); g.addColorStop(0,'#87CEEB'); g.addColorStop(0.5,'#B0E0E6'); g.addColorStop(1,'#E0F6FF'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H*0.6);
 // mountains
 ctx.fillStyle='#A0A0A0'; ctx.beginPath(); ctx.moveTo(0,H*0.55); ctx.lineTo(W*0.2,H*0.35); ctx.lineTo(W*0.4,H*0.45); ctx.lineTo(W*0.6,H*0.32); ctx.lineTo(W*0.8,H*0.42); ctx.lineTo(W,H*0.38); ctx.lineTo(W,H*0.6); ctx.lineTo(0,H*0.6); ctx.closePath(); ctx.fill();
 // sun
 ctx.fillStyle='#FFD700'; ctx.beginPath(); ctx.arc(W*0.85,H*0.12,28,0,Math.PI*2); ctx.fill(); ctx.fillStyle='rgba(255,215,0,0.3)'; ctx.beginPath(); ctx.arc(W*0.85,H*0.12,45,0,Math.PI*2); ctx.fill();
 // ground layers
 let gg=ctx.createLinearGradient(0,H*0.55,0,H); gg.addColorStop(0,'#4CAF50'); gg.addColorStop(0.3,'#2E7D32'); gg.addColorStop(1,'#3E2723'); ctx.fillStyle=gg; ctx.fillRect(0,H*0.55,W,H*0.45);
 // draw trees with depth
 trees.forEach(t=>{
  ctx.save(); ctx.globalAlpha=0.6+t.s*0.4; ctx.font=(28*t.s)+'px Arial'; ctx.fillText(t.type, t.x, t.y); ctx.restore();
 });
}

function loop(){
 drawBackground();
 // update animals
 animals=animals.filter(a=>{
  let alive=a.update();
  if(alive) a.draw();
  return alive;
 });
 // particles
 particles=particles.filter(p=>{ let a=p.update(); if(a) p.draw(); return a; });
 // crosshair
 ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=1.5;
 ctx.beginPath(); ctx.moveTo(cross.x-18, cross.y); ctx.lineTo(cross.x-6, cross.y); ctx.moveTo(cross.x+6, cross.y); ctx.lineTo(cross.x+18, cross.y); ctx.moveTo(cross.x, cross.y-18); ctx.lineTo(cross.x, cross.y-6); ctx.moveTo(cross.x, cross.y+6); ctx.lineTo(cross.x, cross.y+18); ctx.stroke();
 ctx.fillStyle='#f00'; ctx.beginPath(); ctx.arc(cross.x,cross.y,3,0,Math.PI*2); ctx.fill();
 // gun recoil
 ctx.save(); ctx.translate(W/2,H); ctx.translate(0,-gunRecoil*12);
 ctx.font='64px Arial'; ctx.textAlign='center'; ctx.fillText('🔫',0,-12);
 ctx.restore();
 if(gunRecoil>0) gunRecoil*=0.85; if(gunRecoil<0.05) gunRecoil=0;
 requestAnimationFrame(loop);
}

function shoot(){
 if(ammo<=0){ showHit('RELOAD!'); return; }
 ammo--; document.getElementById('ammo').innerText=ammo;
 gunRecoil=1;
 // check hit - distance to crosshair
 let hit=null, minDist=999;
 animals.forEach(a=>{
  if(!a.alive) return;
  let d=Math.hypot(a.x-cross.x, a.y-cross.y);
  if(d<minDist && d< a.size){ minDist=d; hit=a; }
 });
 if(hit){
  hit.hp--; if(hit.hp<=0){ hit.alive=false; hit.vx*=0.2;
   for(let i=0;i<12;i++) particles.push(new Particle(hit.x, hit.y-10, hit.type==='lion'?'#D4A017':'#8B0000'));
   score+=hit.points; document.getElementById('score').innerText=score;
   showHit('HIT! +'+hit.points);
   // screen shake
   canvas.style.transform='translate('+ (Math.random()*6-3) +'px,'+ (Math.random()*6-3) +'px)'; setTimeout(()=>canvas.style.transform='',80);
  } else {
   for(let i=0;i<5;i++) particles.push(new Particle(hit.x, hit.y-10, '#ff0'));
   showHit('HIT!');
   hit.vx*=-1.2; hit.vy=(Math.random()-0.5)*3;
  }
  setTimeout(()=>{ animals=animals.filter(a=>a!==hit ||!a.alive && a.hitTime>30); if(animals.length<5) spawnAnimal(); }, hit.hp<=0?400:0);
 } else {
  // miss - dust
  for(let i=0;i<4;i++) particles.push(new Particle(cross.x+(Math.random()-0.5)*20, cross.y+(Math.random()-0.5)*20, '#aaa'));
 }
 if(ammo===0) setTimeout(()=>{ showHit('RELOAD! Press 4'); },300);
}

function showHit(t){
 let h=document.getElementById('hitmark'); h.innerText=t; h.style.display='block'; h.style.transform='translate(-50%,-50%) scale(1.4)'; setTimeout(()=>{ h.style.display='none'; h.style.transform='translate(-50%,-50%) scale(1)'; },700);
}
function reload(){ ammo=8; document.getElementById('ammo').innerText=ammo; gunRecoil=0.5; showHit('RELOADED'); }
function toggleScope(){
 scopeOn=!scopeOn; let s=document.getElementById('scope'); s.style.display=scopeOn?'block':'none';
 if(scopeOn){ s.style.left=cross.x+'px'; s.style.top=cross.y+'px'; s.style.width='220px'; s.style.height='220px'; }
}
function resetGame(){ score=0; escaped=0; ammo=8; animals=[]; particles=[]; document.getElementById('score').innerText=0; document.getElementById('ammo').innerText=8; document.getElementById('esc').innerText=0; for(let i=0;i<4;i++) setTimeout(spawnAnimal,i*500); }

// input
canvas.addEventListener('mousemove',e=>{ cross.x=e.clientX; cross.y=e.clientY; if(scopeOn){ let s=document.getElementById('scope'); s.style.left=cross.x+'px'; s.style.top=cross.y+'px'; } });
canvas.addEventListener('touchmove',e=>{ e.preventDefault(); cross.x=e.touches[0].clientX; cross.y=e.touches[0].clientY; if(scopeOn){ let s=document.getElementById('scope'); s.style.left=cross.x+'px'; s.style.top=cross.y+'px'; } },{passive:false});
canvas.addEventListener('mousedown',shoot); canvas.addEventListener('touchstart',e=>{ e.preventDefault(); cross.x=e.touches[0].clientX; cross.y=e.touches[0].clientY; shoot(); },{passive:false});
document.addEventListener('keydown',e=>{
 if(e.key==='5'||e.key===' '||e.key==='Enter') shoot();
 if(e.key==='4'||e.key==='r'||e.key==='R') reload();
 if(e.key==='6'||e.key==='s'||e.key==='S') toggleScope();
 if(e.key==='4'||e.key==='ArrowLeft') cross.x=Math.max(30,cross.x-25);
 if(e.key==='6'||e.key==='ArrowRight') cross.x=Math.min(W-30,cross.x+25);
 if(e.key==='2'||e.key==='ArrowUp') cross.y=Math.max(80,cross.y-25);
 if(e.key==='8'||e.key==='ArrowDown') cross.y=Math.min(H-100,cross.y+25);
 if(scopeOn){ let s=document.getElementById('scope'); s.style.left=cross.x+'px'; s.style.top=cross.y+'px'; }
});

for(let i=0;i<4;i++) setTimeout(spawnAnimal,i*600);
setInterval(()=>{ if(animals.length<6&&Math.random()<0.7) spawnAnimal(); },1200);
loop();
<\/script></body></html>`;
}

function makeQualityFootball(t){
 return makeQualityHunting(t,'football').replace('Hunting','Football').replace('🦌','⚽');
}
function makeQualityFighting(t){
 return `<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;overflow:hidden} #c{width:100%;height:100vh;display:block;background:linear-gradient(#1a1a2e,#16213e)} #ui{position:absolute;top:0;left:0;width:100%;padding:10px;display:flex;justify-content:space-between;background:rgba(0,0,0,0.7)}.bar{width:40%;height:16px;background:#333;border-radius:8px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#0f0,#ff0);transition:width 0.2s} #ctrl{position:absolute;bottom:0;left:0;width:100%;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:10px;background:rgba(0,0,0,0.8)} button{padding:18px;border:none;border-radius:12px;font-weight:900}
</style></head><body><canvas id=c></canvas><div id=ui><div class=bar><div id=h1 class=fill></div></div><div>${t}</div><div class=bar><div id=h2 class=fill></div></div></div><div id=ctrl><button style="background:#333;color:#fff" onclick="mv(-1)">◀ 4</button><button style="background:#2196F3;color:#fff" onclick="jump()">JUMP 2</button><button style="background:#333;color:#fff" onclick="mv(1)">6 ▶</button><button style="background:#e50914;color:#fff" onclick="atk()">5 PUNCH</button></div><script>
const C=document.getElementById('c'), X=C.getContext('2d'); let W,H; function R(){ W=innerWidth; H=innerHeight; C.width=W; C.height=H; } R(); addEventListener('resize',R);
let p={x:80,y:H-120,w:60,h:90,hp:100}, e={x:W-140,y:H-120,w:60,h:90,hp:100,vx:0}, sc=0;
function draw(){ X.clearRect(0,0,W,H); X.fillStyle='#16213e'; X.fillRect(0,H*0.6,W,H*0.4); // ground
 X.fillStyle='#ffcc00'; X.fillRect(p.x,p.y,p.w,p.h); X.fillStyle='#00ff88'; X.fillRect(e.x,e.y,e.w,e.h);
 document.getElementById('h1').style.width=p.hp+'%'; document.getElementById('h2').style.width=e.hp+'%';
 requestAnimationFrame(draw);
}
function mv(d){ p.x=Math.max(0,Math.min(W-60,p.x+d*25)); }
function jump(){ p.y-=60; setTimeout(()=>p.y=H-120,300); }
function atk(){ if(Math.abs(p.x-e.x)<90){ e.hp-=15; e.x+=20; if(e.hp<=0){ e.hp=100; e.x=W-140; sc+=100; } } }
setInterval(()=>{ if(Math.abs(e.x-p.x)>80) e.x+=(p.x>e.x?1:-1)*1.5; else if(Math.random()<0.03){ p.hp-=10; if(p.hp<=0){ alert('Lose Score:'+sc); p.hp=100; e.hp=100; } } },16);
draw();
document.addEventListener('keydown',ev=>{ if(ev.key=='4')mv(-1); if(ev.key=='6')mv(1); if(ev.key=='2')jump(); if(ev.key=='5')atk(); });
<\/script></body></html>`;
}
function makeQualityRacing(t){ return makeQualityFighting(t).replace('FIGHTING','RACING'); }
function makeQualityShooter(t){ return makeQualityHunting(t,'shooter').replaceAll('🦌','🧟').replaceAll('🦁','🧟'); }

async function dl(){
 if(!htmlCode)return alert('Build first - type your idea');
 let b=new Blob([htmlCode],{type:'text/html'}); let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=fnameG+'.html'; a.click();
}
async function dlJar(){
 if(!htmlCode)return alert('Build first');
 let zip=new JSZip(); zip.file("META-INF/MANIFEST.MF","Manifest-Version: 1.0\nMIDlet-Name: "+titleG+"\nMIDlet-Version: 1.0\nMIDlet-Vendor: Onike Quality\nMIDlet-1: "+titleG+",, Game\nMicroEdition-Configuration: CLDC-1.1\nMicroEdition-Profile: MIDP-2.0\n");
 zip.file("game.html",htmlCode);
 let blob=await zip.generateAsync({type:"blob"}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fnameG+'.jar'; a.click();
 let jad="MIDlet-Name: "+titleG+"\nMIDlet-Version: 1.0\nMIDlet-Vendor: Onike\nMIDlet-1: "+titleG+",, Game\nMIDlet-Jar-URL: "+fnameG+".jar\nMIDlet-Jar-Size: "+blob.size+"\nMicroEdition-Configuration: CLDC-1.1\nMicroEdition-Profile: MIDP-2.0\n";
 let b2=new Blob([jad],{type:"text/vnd.sun.j2me.app-descriptor"}); let b=document.createElement('a'); b.href=URL.createObjectURL(b2); b.download=fnameG+'.jad'; b.click();
}
</script>
</body>
  </html>
